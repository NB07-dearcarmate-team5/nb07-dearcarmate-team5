paths:
  /images/upload:
    post:
      tags:
        - Image
      summary: 이미지 URL 생성
      description: 파일을 업로드하고, 접근 가능한 이미지 URL을 반환받습니다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: 업로드할 이미지 파일
              example:
                image: "File"
      responses:
        200:
          description: 이미지 업로드 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageUrl:
                    type: string
                    example: https://testcar-backend.onrender.com/uploads/sample.jpg